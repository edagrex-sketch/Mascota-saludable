<style>
      body {
        background-color: #FAFAFA;
        color: #1a1c1c;
        overflow-x: hidden;
      }
      .organic-blob {
        border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        animation: morph 12s ease-in-out infinite;
      }
      @keyframes morph {
        0%, 100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
        33% { border-radius: 70% 30% 50% 50% / 30% 60% 40% 70%; }
        66% { border-radius: 50% 50% 30% 70% / 60% 40% 60% 40%; }
      }
      .stagger-up {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeInUp 0.8s ease-out forwards;
      }
      @keyframes fadeInUp {
        to { opacity: 1; transform: translateY(0); }
      }
      .soft-shadow {
        box-shadow: 0px 4px 20px rgba(26, 60, 64, 0.04);

</div>
</section>
<!-- Content Area -->
<section class="pb-xxl space-y-xl">
<div class="text-center space-y-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight stagger-up" style="animation-delay: 0.3s;">
                    Todo su historial en un solo lugar
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant stagger-up" style="animation-delay: 0.4s;">
                    Gestiona vacunas, consultas y recordatorios con la profesionalidad que tu mascota merece.
                </p>
</div>
<!-- Progress Indicator -->
<div class="flex justify-center items-center space-x-sm stagger-up" style="animation-delay: 0.5s;">
<span class="w-6 h-1.5 rounded-full bg-primary transition-all duration-300"></span>
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
</div>

                    Siguiente
                    <span class="material-symbols-outlined ml-sm group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</section>
<!-- Subtle ambient animation script -->
<script>
            document.addEventListener('DOMContentLoaded', () => {
                const blob = document.querySelector('.organic-blob');
                
                // Light touch interaction on the blob
                blob.addEventListener('touchstart', () => {
                    blob.style.transform = 'scale(0.98)';
                    blob.style.transition = 'transform 0.3s ease';
                });
                
                blob.addEventListener('touchend', () => {
                    blob.style.transform = 'scale(1)';
                });

                // Simple entrance animation for text
                const elements = document.querySelectorAll('.stagger-up');
                elements.forEach((el, index) => {
                    el.style.animationDelay = `${0.2 + (index * 0.1)}s`;
                });
            });
        </script>
</main>
